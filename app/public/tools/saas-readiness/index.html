  <div class="card" id="input-card">

            <div class="input-group">

<script>
function encodeState(obj) {
  const compressed = btoa(encodeURIComponent(JSON.stringify(obj)));
  window.location.hash = compressed;
  return compressed;
}

function decodeState() {
  try {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    return JSON.parse(decodeURIComponent(atob(hash)));
  } catch(e) { return null; }
}

function calculate() {
  const mcp_ready = document.getElementById('mcp_ready').value || "Talked to 3-5 people";
  const landing_page = document.getElementById('landing_page').value || "Landing page, no waitlist";
  const mvp_status = document.getElementById('mvp_status').value || "Building";
  const pricing = document.getElementById('pricing').value || "Freemium with paid tiers";
  const distribution = document.getElementById('distribution').value || "One channel (social/content/ads)";
  const analytics = document.getElementById('analytics').value || "Basic GA/PostHog";
  const support = document.getElementById('support').value || "Email + docs/knowledge base";
  const legal = document.getElementById('legal').value || "Privacy policy only";
  
  // Encode inputs for sharing
  const inputState = {};
  inputState['mcp_ready'] = mcp_ready;
  inputState['landing_page'] = landing_page;
  inputState['mvp_status'] = mvp_status;
  inputState['pricing'] = pricing;
  inputState['distribution'] = distribution;
  inputState['analytics'] = analytics;
  inputState['support'] = support;
  inputState['legal'] = legal;
  encodeState({inputs: inputState});
  

  const scores = {
    'mcp_ready': {'No, it\'s just an idea': 0, 'Talked to 3-5 people': 35, 'Yes, 10+ conversations with ICP': 100},
    'landing_page': {'Not yet': 0, 'Landing page, no waitlist': 30, 'Landing page + waitlist + email capture': 100},
    'mvp_status': {'Not started': 0, 'Building': 25, 'Live with beta users': 65, 'Live with paying customers': 100},
    'pricing': {'Not decided': 0, 'Free only': 30, 'Freemium with paid tiers': 80, 'Paid from day one': 100},
    'distribution': {'Not sure yet': 0, 'One channel (social/content/ads)': 40, 'Two channels': 70, 'Multi-channel with data': 100},
    'analytics': {'Nothing': 0, 'Basic GA/PostHog': 50, 'Full funnel tracking + cohorts': 100},
    'support': {'None': 0, 'Email only': 30, 'Email + docs/knowledge base': 70, 'Email + docs + live chat': 100},
    'legal': {'Nothing': 0, 'Privacy policy only': 40, 'Privacy + ToS + GDPR ready': 75, 'Full compliance + DPA': 100}
  };
  
  const answers = {mcp_ready, landing_page, mvp_status, pricing, distribution, analytics, support, legal};
  let total = 0, count = 0;
  const details = [];
  for (const [k, v] of Object.entries(answers)) {
    const s = (scores[k] || {})[v] || 0;
    total += s;
    count++;
    details.push({key: k, value: v, score: s});
  }
  const avg = Math.round(total / count);
  const tier = avg >= 80 ? '🚀 Launch Ready' : avg >= 55 ? '🔧 Almost There' : avg >= 30 ? '📋 Early Stage' : '💡 Idea Phase';
  
  const weaknesses = details.filter(d => d.score < 50).map(d => d.key);
  const strengths = details.filter(d => d.score >= 80).map(d => d.key);
  
  const result = {
    score: avg,
    tier: tier,
    strengths: strengths,
    weaknesses: weaknesses,
    recommendation: avg >= 80 ? 'You\'re ready to launch. Focus on distribution.' : avg >= 55 ? 'Close the gaps in ' + weaknesses.slice(0,2).join(' and ') + '.' : 'Start with customer validation before building.'
  };

  displayResults(result);
  document.getElementById('result-card').classList.add('show');
  document.getElementById('result-card').scrollIntoView({behavior:'smooth'});
}

// This document is served with CSP `require-trusted-types-for 'script'`, so a
// bare innerHTML assignment throws TypeError and the results never render. That
// is invisible in local file:// testing — it only fails on the deployed origin.
// Pass-through is sound HERE because every string below is built from in-page
// constants: the only externally-controlled input is the share hash, and those
// values are assigned solely to <select>.value, which silently drops anything
// outside the fixed option list. Do NOT copy this policy to a tool that renders
// free text.
const TT = window.trustedTypes && window.trustedTypes.createPolicy
  ? window.trustedTypes.createPolicy('saas-readiness-results', { createHTML: s => s })
  : null;
function setHTML(el, html) { el.innerHTML = TT ? TT.createHTML(html) : html; }

function displayResults(r) {
  if (r.error) {
    setHTML(document.getElementById('result-content'), '<div class="verdict" style="color:#f87171">' + r.error + '</div>');
    return;
  }
  
  let html = '';
  
  // Score circle if present
  // ?? not || — a legitimate score of 0 is falsy, and || silently dropped the
  // score circle for anyone answering worst-case to every question.
  const scoreVal = r.score ?? r.risk_score ?? r.overall;
  if (scoreVal !== undefined) {
    const scoreClass = scoreVal >= 80 ? 'score-high' : scoreVal >= 50 ? 'score-mid' : 'score-low';
    const scoreLabel = r.score !== undefined ? 'SCORE' : r.risk_score !== undefined ? 'RISK' : 'RATING';
    html += '<div class="score-circle ' + scoreClass + '">' + scoreVal + '<span class="label">' + scoreLabel + '</span></div>';
  }
  
  // Verdict
  if (r.verdict || r.tier) {
    html += '<div class="verdict">' + (r.verdict || r.tier) + '</div>';
  }
  
  // Key metrics
  html += '<div class="metrics">';
  const skipKeys = ['score', 'risk_score', 'verdict', 'tier', 'error', 'providers', 'scenarios', 'alternatives', 'dimensions', 'recommendations', 'red_flags', 'recommendation', 'gaps', 'key_action', 'username', 'disclaimer', 'note', 'method', 'type', 'agent_risk_level', 'cheapest', 'savings_vs_most_expensive'];
  
  // Show key numeric/string results
  for (const [k, v] of Object.entries(r)) {
    if (skipKeys.includes(k)) continue;
    if (typeof v === 'object' || Array.isArray(v)) continue;
    const label = k.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    html += '<div class="metric"><div class="val">' + v + '</div><div class="lbl">' + label + '</div></div>';
  }
  
  // Provider table for cost calculators
  if (r.providers) {
    html += '</div><div style="margin-top:1rem">';
    html += '<table style="width:100%;border-collapse:collapse;font-size:0.85rem">';
    html += '<tr style="color:#64748b;text-align:left"><th style="padding:0.5rem">Provider</th><th style="padding:0.5rem;text-align:right">Monthly</th><th style="padding:0.5rem;text-align:right">Annual</th></tr>';
    for (const p of r.providers) {
      html += '<tr style="border-top:1px solid #1e293b"><td style="padding:0.5rem;color:#e2e8f0">' + p.name + '</td><td style="padding:0.5rem;text-align:right;font-weight:600;color:#60a5fa">' + p.monthly + '</td><td style="padding:0.5rem;text-align:right;color:#94a3b8">' + p.annual + '</td></tr>';
    }
    html += '</table>';
  }
  
  // Scenarios table
  if (r.scenarios) {
    html += '</div><div style="margin-top:1rem">';
    for (const s of r.scenarios) {
      html += '<div class="metric"><div class="val">$' + Number(s.proceeds).toLocaleString() + '</div><div class="lbl">' + s.label + '</div></div>';
    }
  }
  
  // Alternatives
  if (r.alternatives) {
    html += '</div><div style="margin-top:1rem">';
    for (const a of r.alternatives) {
      html += '<div class="metric"><div class="val">$' + Number(a.cost).toLocaleString() + '</div><div class="lbl">' + a.shop + '</div></div>';
    }
  }
  
  html += '</div>';
  
  // Recommendations
  if (r.recommendations && r.recommendations.length > 0) {
    html += '<div class="recommendations"><h3>💡 Recommendations</h3><ul>';
    for (const rec of r.recommendations) {
      html += '<li>' + rec + '</li>';
    }
    html += '</ul></div>';
  } else if (r.recommendation) {
    html += '<div class="recommendations"><h3>💡 Recommendation</h3><p style="color:#cbd5e1;font-size:0.9rem">' + r.recommendation + '</p></div>';
  }
  
  // Red flags
  if (r.red_flags && r.red_flags.length > 0) {
    html += '<div class="recommendations" style="border:1px solid #7f1d1d"><h3 style="color:#f87171">🚩 Red Flags</h3><ul>';
    for (const f of r.red_flags) {
      html += '<li style="color:#fca5a5">' + f + '</li>';
    }
    html += '</ul></div>';
  }
  
  // Gaps
  if (r.gaps && r.gaps.length > 0) {
    html += '<div class="recommendations"><h3>⚠️ Gaps to Address</h3><ul>';
    for (const g of r.gaps) {
      html += '<li>' + g.replace(/_/g, ' ') + '</li>';
    }
    html += '</ul></div>';
  }
  
  setHTML(document.getElementById('result-content'), html);
}

function copyLink() {
  const url = window.location.href;
  navigator.clipboard.writeText(url).then(() => {
    const btn = event.target;
    const orig = btn.textContent;
    btn.textContent = '✅ Copied!';
    btn.style.background = '#14532d';
    btn.style.borderColor = '#22c55e';
    setTimeout(() => { btn.textContent = orig; btn.style.background = '#1e3a5f'; btn.style.borderColor = '#3b82f6'; }, 2000);
  });
}

function shareTwitter() {
  const text = encodeURIComponent(document.title + ' — Check your score:');
  const url = encodeURIComponent(window.location.href);
  window.open('https://x.com/intent/tweet?text=' + text + '&url=' + url, '_blank');
}

function shareLinkedIn() {
  const url = encodeURIComponent(window.location.href);
  const title = encodeURIComponent(document.title);
  window.open('https://www.linkedin.com/sharing/share-offsite/?url=' + url, '_blank');
}

// Range input live updates
document.querySelectorAll('.input-range').forEach(el => {
  el.addEventListener('input', function() {
    const valSpan = document.getElementById(this.id + '-val');
    if (valSpan) {
      const unit = valSpan.textContent.replace(/[0-9.-]/g, '');
      valSpan.textContent = this.value + (unit || '');
    }
  });
});

// Restore state from URL hash on load
window.addEventListener('DOMContentLoaded', function() {
  const state = decodeState();
  if (state && state.inputs) {
    for (const [key, val] of Object.entries(state.inputs)) {
      const el = document.getElementById(key);
      if (el) {
        if (el.type === 'range') {
          el.value = val;
          const vs = document.getElementById(key + '-val');
          if (vs) vs.textContent = val + (vs.textContent.replace(/[0-9.-]/g, '') || '');
        } else {
          el.value = val;
        }
      }
    }
    // Auto-calculate on page load with shared state
    calculate();
  }
});
</script>
